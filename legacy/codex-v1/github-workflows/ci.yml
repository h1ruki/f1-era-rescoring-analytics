name: CI

on:
  push:
    branches:
      - development/v1
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install -e "./apps/backend[test]"

      - name: Lint backend (Ruff)
        if: matrix.python-version == '3.11'
        run: python -m ruff check --no-cache --config apps/backend/pyproject.toml apps/backend/src apps/backend/tests

      - name: Run complete backend suite
        run: python -B -m pytest -c apps/backend/pyproject.toml apps/backend/tests -q -p no:cacheprovider

      - name: Run 2010–2013 historical diagnostic
        if: matrix.python-version == '3.14'
        run: PYTHONPATH=apps/backend/src python -B -m f1_eras.verification.diagnostic

      - name: Verify canonical database is unchanged
        if: always()
        run: test "$(git hash-object --no-filters data/f1db.db)" = "$(git rev-parse HEAD:data/f1db.db)"

  frontend-linux:
    name: Frontend and Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Validate Bash launcher syntax
        run: bash -n run_dev.sh

      - name: Install locked frontend dependencies
        run: npm --prefix apps/frontend ci

      - name: Run frontend tests
        run: npm --prefix apps/frontend test

      - name: Build production frontend
        run: npm --prefix apps/frontend run build
