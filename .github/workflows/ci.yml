name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest
      # Rebuild from the pinned F1DB release; the tracked output must not change.
      - run: python pipeline/build_seasons.py
      - run: git diff --exit-code data/seasons.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
      - run: npm run build # type-checks before bundling
