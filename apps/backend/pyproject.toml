[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-eras-backend"
version = "0.1.0"
description = "Read-only F1 ERAs analytics and API"
requires-python = ">=3.11"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = ["integration: read-only checks against the repository F1DB snapshot"]
